# Builds the site with Eleventy and publishes it to GitHub Pages on every push to main.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"   # nightly rebuild so upcoming seminars move to the archive

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # keeps the last good OpenAlex download in case the service is down during a build
      - uses: actions/cache@v4
        with:
          path: .cache
          key: openalex-${{ github.run_id }}
          restore-keys: openalex-
      - run: python3 tools/fetch_photos.py
      - run: npm run build
        env:
          # "/<repo>/" for https://<user>.github.io/<repo>/, "/" for a custom domain
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

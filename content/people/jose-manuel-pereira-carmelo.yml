bio: |
  José Carmelo received his PhD from the University of Copenhagen in 1986. His research is in quantum condensed matter systems, including recent studies of the Hubbard model on bipartite lattices. Over the past forty years, much of his work has been devoted to low-dimensional correlated systems.

bio: |
  Fernando Cruz is an MSc student in Theoretical Physics at the Faculty of Sciences of the University of Porto (FCUP). For his dissertation he studies correlated phases in two-dimensional quasiperiodic systems, supervised by Eduardo Castro and Bruno Amorim. He is also a research fellow in the QPI-MoireS project, coordinated by Eduardo Castro.

bio: |
  Ricardo completed his undergraduate and master's studies at the Faculdade de Ciências da Universidade do Porto (FCUP). He then began his PhD at FCUP in 2023 under the supervision of Prof. Miguel Costa and Prof. Vasco Gonçalves.

  His research focuses on understanding the non-perturbative structure of Quantum Field Theories via the conformal and S-matrix bootstrap. These approaches allow for the study of physical theories at any value of the couplings and independently of a Lagrangian description. Additionally, he is interested in energy correlators, which connect formal bootstrap techniques to actual collider physics. These observables not only provide high-precision insights into QCD and jet substructure, but also offer a rigorous framework to study Lorentzian dynamics in conformal field theories.

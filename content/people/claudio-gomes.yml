bio: |
  Cláudio Gomes holds a PhD in Theoretical Physics in the areas of Gravitation and Cosmology. His research interests include alternative theories of gravity, gravitational waves, black holes, cosmic inflation, dark matter and dark energy, as well as interdisciplinary approaches in physics.

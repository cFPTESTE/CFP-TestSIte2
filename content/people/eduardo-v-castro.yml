bio: |
  Eduardo V. Castro is an Associate Professor at the Physics and Astronomy Department of the Faculty of Sciences of University Porto (UP). After his PhD, obtained from UP in 2008, he was a visiting post-doc at MPI-PKS in Dresden, and a Juan de la Cierva post-doc at ICMM-CSIC in Madrid. In 2012 he joined IST at University of Lisbon as an Assistant Professor, and moved to UP in 2018. E. V. Castro has a background in Theoretical Condensed Matter Physics, with focus on phenomenological descriptions of 2D systems and topological matter.

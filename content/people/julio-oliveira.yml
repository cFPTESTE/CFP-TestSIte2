bio: |
  Júlio Oliveira’s PhD research focuses on developing novel numerical methods that leverage the power of artificial intelligence to solve problems in High Energy Physics. His work focuses on engineering neural networks that might represent a viable ground state of a given quantum system and using them to probe the gauge/gravity duality in Matrix Models such as the BMN.

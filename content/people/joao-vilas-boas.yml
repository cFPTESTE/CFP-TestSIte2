bio: |
  João Vilas Boas received his PhD from the University of Porto in 2024, following undergraduate studies at the same institution and a master's degree at École Normale Supérieure de Paris. He joined the CFP in October 2026, following two years as a postdoctoral researcher at the School of Mathematical Sciences at Queen Mary University of London.

  His research focuses on holography and the AdS/CFT correspondence, with a particular interest in the structure and dynamics of strongly coupled quantum field theories and their gravitational duals. His research draws on conformal field theory (CFT) techniques, including the analytic conformal bootstrap, to develop non-perturbative approaches to understanding CFTs and holographic theories.

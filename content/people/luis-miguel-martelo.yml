bio: |
  L. M. Martelo received his PhD in Physics in 2000 from University of Évora (Portugal), under supervision of Professor José Carmelo, in collaboration with the University of Fribourg (Switzerland) under supervision of Professor Dionys Baeriswyl. Currently, he is a staff member of the Faculty of Engineering of University of Porto (FEUP) and member of Centro de Física do Porto since 2009. Research interests on Condensed Matter Physics: strongly correlated low-dimensional fermionic and bosonic systems, Bethe Ansatz and integrable models, electronic properties of graphene under spin-orbit superlattices.

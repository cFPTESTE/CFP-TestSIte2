bio: |
  Bruno Fernandes obtained his Bachelor's degree in 2020 and his Master's degree in 2022, both from the University of Porto. He is currently a PhD student whose research focuses on calculating observables in conformal gauge theories, namely N=4 Supersymmetric Yang-Mills theory, such as correlation functions of local operators and Wilson loops. His work exploits the enhanced symmetry of these theories to obtain explicit results. The calculation of these quantities gives insights into how to approach more general, non-conformal gauge theories, and in particular are important steps towards calculating scattering amplitudes which can be experimentally observed in particle colliders.

bio: |
  Helena da Silva is a PhD student researching the non-linear Hall effect (NLHE) and its potential as a probe of topology in quantum materials. She holds a Master's degree in Physics from the University of Porto, specialising in experimental physics. Her current research combines theoretical modelling with experimental work, focusing on the intrinsic contribution to the NLHE associated with the Berry curvature dipole (BCD). Her objectives include identifying NLHE enhancement strategies, understanding BCD emergence through deliberate symmetry breaking, and developing scaling laws to distinguish intrinsic from extrinsic contributions in experimental measurements.

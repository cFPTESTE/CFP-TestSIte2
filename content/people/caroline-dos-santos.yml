bio: |
  Caroline dos Santos received her PhD from Durham University in 1999, supervised by Ruth Gregory at the Centre for Particle Theory (CPT), Department of Mathematical Sciences. She has taught at the Department of Physics of the Faculty of Sciences of the University of Porto since 1991 and has been a member of Centro de Física do Porto since 2002.

bio: |
  João Santos Silva is a PhD Candidate in Theoretical Physics at the Faculty of Sciences of the University of Porto (FCUP), where he also completed his BSc and MSc degrees in Physics. His scientific trajectory includes research projects at FCUP and ICMM-CSIC in Spain, alongside teaching experience as an Invited Assistant at ISEP. Currently, his research focuses on the properties of topological matter lacking translational invariance. His main research interests revolve around the interplay between disorder, interactions, and nontrivial topological phases.

bio: |
  Luís holds a Bachelor's degree in Physics and Physics Education (2019) and a Master's degree in Theoretical Physics (2021) from the Federal University of Bahia, Brazil. From 2021 to 2023, he worked as a high school physics teacher at the Federal Institute of Bahia. He is currently pursuing a PhD in Physics at the University of Porto, under the supervision of Professor Orfeu Bertolami.

  His research interests lie in Gravitation and Cosmology, with a particular focus on the theoretical and phenomenological aspects of cosmologically coupled black holes (black holes whose evolution is linked to the dynamics of the expanding Universe), primordial black holes, and black hole thermodynamics.

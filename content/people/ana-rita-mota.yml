bio: |
  Ana Rita Mota is a physics and chemistry teacher and researcher in physics education. She earned her PhD in Physics Education from the University of Porto, Portugal, under the supervision of João Lopes dos Santos. In 2015–2016, she was a postdoctoral researcher with Eric Mazur’s Physics Education Group at Harvard University, where she also served as a teaching assistant for Energy Within Environmental Constraints and Applied Physics. Her current interests focus on metacognition in physics education and on the role of metacognitive strategies in supporting students’ learning of physics.

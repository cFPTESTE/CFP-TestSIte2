bio: |
  Ricardo Oliveira holds a Master's degree from the Faculty of Sciences of the University of Porto (FCUP) and is currently a PhD student and researcher at the Centro de Física do Porto (CFP). His research focuses on theoretical and computational condensed matter physics, with a particular interest in low-dimensional systems, quasiperiodic materials, and moiré physics. His work explores electronic properties and correlated states, aiming to uncover how spatial order, dimensionality, and quantum criticality shape novel material behaviors.

bio: |
  Vasco Gonçalves obtained his BSc, MSc and PhD in Physics from the University of Porto. From 2016 to 2020 he was a postdoctoral researcher at ICTP-SAIFR. He then returned to Porto as a postdoctoral researcher and later became a permanent Assistant Researcher. His main research interests are conformal field theories, gauge theories and holography.

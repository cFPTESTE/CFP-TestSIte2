bio: |
  Following his Engineering Physics Bachelor's degree taken at the Faculty of Sciences of the University of Porto, Rui Miranda completed his Physics Master's degree at the same institution in 2025, specialising in Quantum Condensed Matter theory. His dissertation, titled "Towards Excitonic Instabilities in 2D Materials with Nontrivial Topology," focused on the mean-field treatment of the excitonic instability in Mexican-hat conduction band systems as a toy model to study experimentally tunable excitonic signatures for 2D topological materials, systems whose topological character may itself be stabilized by their excitonic nature. After finishing his Master's, he continued this line of work, applying the developed numerical models to materials such as WTe2. Now enrolled in the MAP-Fis doctoral programme, he intends to deepen the understanding of how excitonic phases interact with topologically nontrivial systems.

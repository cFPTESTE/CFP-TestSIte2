bio: |
  Vitor is a quantum condensed matter theorist interested in quantum materials. From 2010 to 2020, he was Principal Investigator at the National University of Singapore, where he was a founding member of the Centre for Advanced 2D Materials. He received his PhD in theoretical condensed matter physics for research carried out jointly at Boston University and the University of Porto.

  He has dexterity in a variety of analytical methods as well as advanced numerical techniques to investigate novel properties and potential applications of quantum materials. A prevalent theme of his work has been developing microscopic models that explain experimental observations and predict new physical phenomena, often in close collaboration with experimental groups in Europe, the United States and Asia.

  He has made recognized contributions to the rise of graphene and more broadly across the field of 2D quantum materials, tackling themes of electronic interactions and strong correlations, disorder, strain-engineering, impurity physics, collective many-body effects, nonlinear response, spintronics, and topological phenomena.

  Vitor has published extensively in leading international journals, including a full review article in Rev. Mod. Phys., several Nature-family journals and Phys. Rev. Lett., and has been a regular invited speaker within this field. He is also actively involved in teaching, doctoral supervision, postdoctoral mentoring, and advanced research training.

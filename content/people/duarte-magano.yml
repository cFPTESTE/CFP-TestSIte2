bio: |
  Duarte Magano works on quantum computing and its applications. He obtained his bachelor's degree in Physics from the University of Porto and his master's degree in Theoretical Physics from the École Normale Supérieure in Paris, and completed a PhD in Physics at the University of Lisbon, carrying out his doctoral research in quantum computing at Instituto Superior Técnico and Instituto de Telecomunicações.

  His research interests include quantum algorithms, quantum approaches to data analysis, and computational methods for near-term quantum devices. He has developed quantum methods for classical data-reconstruction problems, including particle-track reconstruction, clustering and link prediction. His work has also explored the quantum simulation of complex networks, super-resolution techniques for quantum simulation, and trade-offs between sampling complexity and quantum-circuit depth.

  In addition to his academic research, he has experience in industrial research and development and currently works on advanced autonomous and decision-making systems for defence applications.

bio: |
  Miguel Barroso Varela is a PhD student at the University of Porto, having earned an MSci in Theoretical Physics from Imperial College London in 2023. As a theorist working in phenomenological cosmology, his research bridges foundational physics with observational data. His work encompasses modified gravity and its role in late-time cosmology, such as addressing the Hubble tension and analyzing the growth of density perturbations. He has also worked on interacting dark sector models and their implications on the role of dark matter and dark energy in the Universe. Additionally, he focuses on exploring the theoretical and phenomenological aspects of chain inflation, with an emphasis on its impact on observational signals from the early Universe, such as stochastic gravitational wave signals that could be detectable by upcoming interferometers or the formation of primordial black holes.

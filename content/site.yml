name: Centro de Física do Porto
short: CFP
tagline: Theoretical physics at the University of Porto
# Visual theme: "" (dark bands, default) or "swiss" (light, grid, FCUP-blue colour fields)
theme: ""
about: >-
  The Centro de Física do Porto (CFP) is a research unit based at the Department of
  Physics and Astronomy of the Faculty of Sciences of the University of Porto. It is
  devoted to research in theoretical physics: quantum physics and fields in high energy
  and condensed matter, gravitation and cosmology.
founded: 1994
# Shown in the "About the centre" section of the home page. Markdown: [text](link)
affiliation: >-
  The Centro de Física do Porto is the Porto node of the
  [Centro de Física das Universidades do Minho e do Porto (CF-UM-UP)](https://www.cf-um-up.pt/),
  a research unit of the [LaPMET](https://www.lapmet.org/) consortium – Laboratory of Physics
  for Materials and Emerging Technologies – with facilities at the
  [Department of Physics and Astronomy](https://www.fc.up.pt/dfa/) of the Faculty of Sciences
  of the University of Porto.
# Institutions shown next to the text above and in the footer.
# logo: name of a file in src/assets/logos/ (without extension); leave empty to show the name.
partners:
  - name: CF-UM-UP
    logo: cf-um-up
    url: https://www.cf-um-up.pt/
    text: >-
      Centro de Física das Universidades do Minho e do Porto. Created in 2014 by joining two
      research units founded in 1994 – the Centro de Física da Universidade do Minho (CFUM) and
      the Centro de Física do Porto (CFP) – and evaluated by FCT.
  - name: LaPMET
    logo: lapmet
    url: https://www.lapmet.org/
    text: >-
      Laboratory of Physics for Materials and Emerging Technologies. Brings together four physics
      research units – CFP and IFIMUP (University of Porto), CFUM (University of Minho) and CeFEMA
      (Instituto Superior Técnico) – around quantum materials, energy, communications, photonics
      and nanotechnology.
fct_recognised: 1997
address:
  - Departamento de Física e Astronomia
  - Faculdade de Ciências da Universidade do Porto
  - Rua do Campo Alegre 687
  - 4169-007 Porto, Portugal
youtube:
  url: https://www.youtube.com/@centrodefisicadoporto
  channel_id: UCgxtHgvJlk7uI6tY01xbXaA
  about: Journal clubs, seminars and colloquia of theoretical physics.
publications:
  # A paper counts as CFP work when the member's affiliation printed on it matches one of
  # these patterns (regular expressions, compared in lower case and without accents).
  affiliation_patterns:
    - "centro de fisica do porto"
    - "centro de fisica da universidade do porto"
    - "fisica.{0,40}minho e (do )?porto"
    - "physics.{0,40}minho and (of )?porto"
    - "cent(er|re) (of|for) physics (of|at) (the )?university of porto"
    - "cf-?um-?up"
    - "\\bcfp\\b.*porto|porto.*\\bcfp\\b"
  # Optional: an email for OpenAlex's "polite pool" (faster, more reliable).
  openalex_mailto: ""

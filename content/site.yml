name: Centro de Física do Porto
short: CFP
tagline: Theoretical physics at the University of Porto
# Visual theme: "" (dark bands, default) or "swiss" (light, grid, FCUP-blue colour fields)
theme: ""
about: >-
  The Centro de Física do Porto (CFP) is a research unit based at the Department of
  Physics and Astronomy of the Faculty of Sciences of the University of Porto. It is
  devoted to research in theoretical physics: quantum physics and fields in high energy
  and condensed matter, gravitation and cosmology.
founded: 1994
fct_recognised: 1997
address:
  - Departamento de Física e Astronomia
  - Faculdade de Ciências da Universidade do Porto
  - Rua do Campo Alegre 687
  - 4169-007 Porto, Portugal
youtube:
  url: https://www.youtube.com/@centrodefisicadoporto
  channel_id: UCgxtHgvJlk7uI6tY01xbXaA
  about: Journal clubs, seminars and colloquia of theoretical physics.
publications:
  # A paper counts as CFP work when the member's affiliation printed on it matches one of
  # these patterns (regular expressions, compared in lower case and without accents).
  affiliation_patterns:
    - "centro de fisica do porto"
    - "centro de fisica da universidade do porto"
    - "fisica.{0,40}minho e (do )?porto"
    - "physics.{0,40}minho and (of )?porto"
    - "cent(er|re) (of|for) physics (of|at) (the )?university of porto"
    - "cf-?um-?up"
    - "\\bcfp\\b.*porto|porto.*\\bcfp\\b"

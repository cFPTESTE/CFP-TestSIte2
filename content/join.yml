# "Join us" page (/join/). Edit freely; text fields accept Markdown: [text](link), **bold**.

intro: >-
  We welcome students and researchers who want to work in theoretical physics. Most people
  join CFP by getting in touch directly with a member whose work interests them: the list of
  possible supervisors and hosts, by research area, is at the bottom of this page.

# Open calls (PhD grants, postdoc positions, MSc projects...). The page shows the ones whose
